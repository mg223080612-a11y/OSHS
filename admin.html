<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>공연 관리 | Our Story, His Story</title>
  <!-- 운영진 전용 페이지 : 메뉴 어디에도 연결하지 않음. 주소 story.gvcs.kr/admin.html -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">
  <main class="ad-wrap">
    <p class="ad-kicker">OUR STORY, HIS STORY · 운영진 전용</p>
    <h1>공연 관리</h1>

    <!-- 1. 비밀번호 -->
    <form class="ad-login" action="#">
      <label for="ad-key">관리자 비밀번호</label>
      <div class="ad-row">
        <input id="ad-key" type="password" autocomplete="current-password" required />
        <button type="submit">들어가기</button>
      </div>
      <p class="ad-msg" role="alert"></p>
    </form>

    <!-- 2. 상태 + 버튼 -->
    <section class="ad-panel" hidden aria-labelledby="ad-now-title">
      <h2 id="ad-now-title" class="sr-only">지금 상태</h2>
      <p class="ad-label">지금 방문자 화면</p>
      <p class="ad-now" aria-live="polite"><span class="ad-dot" aria-hidden="true"></span><b data-now>확인 중…</b></p>
      <p class="ad-sub" data-sub></p>

      <button type="button" class="ad-end" data-end>
        <span class="ad-end-idle">공연 종료</span>
        <span class="ad-end-hold">꾹 누르고 있으면 종료돼요…</span>
      </button>
      <p class="ad-help">실수로 눌리지 않게, 버튼을 <b>1.5초 동안 꾹</b> 누르면 종료돼요. 누르면 모든 방문자 화면이 1~2분 안에 THE END 커튼으로 바뀌어요.</p>

      <button type="button" class="ad-undo" data-undo hidden>되돌리기 (다시 공연 중으로)</button>

      <ul class="ad-links">
        <li><a href="index.html?preview=onair" target="_blank" rel="noopener">공연 중 화면 미리보기 ↗</a></li>
        <li><a href="index.html?preview=after" target="_blank" rel="noopener">공연 후 화면 미리보기 ↗</a></li>
      </ul>
      <button type="button" class="ad-logout" data-logout>로그아웃</button>
    </section>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
